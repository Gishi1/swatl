# swatl provider configuration — EXAMPLE
#
# Copy this file to a location swatl reads, then fill in what you need:
#
#   mkdir -p ~/.config/swatl
#   cp config/providers.example.toml ~/.config/swatl/providers.toml
#
# Lookup order (first existing file wins):
#   1. ~/.config/swatl/providers.toml
#   2. ./config/providers.toml
#   3. ./providers.toml
#
# API keys are never stored here — only the name of the environment variable
# that holds them. Export the variable before running swatl:
#
#   export DEEPSEEK_API_KEY=sk-...
#
# For local providers (Ollama, LM Studio), set base_url to the local endpoint
# and leave api_key_env empty.
#
# timeout (seconds, default 60) bounds a single HTTP request. Raise it for
# local models that are loaded on demand: when llama-server runs with
# --sleep-idle-seconds it unloads the weights after a period of idleness, and
# the first request after that waits for the model to be read back in (tens of
# seconds for a 30B+ model).

[deepseek]
type = "openai-compatible"
base_url = "https://api.deepseek.com/v1"
model = "deepseek-chat"
api_key_env = "DEEPSEEK_API_KEY"

[openai]
type = "openai-compatible"
base_url = "https://api.openai.com/v1"
model = "gpt-4o"
api_key_env = "OPENAI_API_KEY"

[anthropic]
type = "openai-compatible"
base_url = "https://api.anthropic.com/v1"
model = "claude-sonnet-4-20250514"
api_key_env = "ANTHROPIC_API_KEY"

[ollama]
type = "openai-compatible"
base_url = "http://localhost:11434/v1"
model = "qwen2.5:32b"
# Empty means the endpoint needs no authentication: no Authorization header
# is sent and no environment variable has to be set.
api_key_env = ""

[dashscope]
type = "openai-compatible"
base_url = "https://dashscope.aliyuncs.com/compatible-mode/v1"
model = "qwen3-mt"
api_key_env = "DASHSCOPE_API_KEY"

# ── Embedding backend (optional) ───────────────────────────────────────────
# Used to index a context database so its entries can be injected into
# translation prompts as related context. Requires `pip install faiss-cpu`
# (already a dependency).
#
# Ollama is the default and needs no API key:
#   ollama pull bge-m3          # 1024-dim, strong on Chinese and English
#
# When this section is absent, swatl auto-detects a reachable Ollama server.
# Any OpenAI-compatible embeddings endpoint works too:
#   backend = "openai"
#   base_url = "http://localhost:1234/v1"
#   api_key_env = "EMBEDDING_API_KEY"
[embedding]
backend = "ollama"
model = "bge-m3"
base_url = "http://127.0.0.1:11434"

# ── Dedicated machine-translation models ───────────────────────────────────
# Models like Tencent Hy-MT2 answer a short instruction with the translation
# only; they do not follow the JSON id-map prompt used for chat models, so set
# mode = "plain". Each segment is then sent as its own request with greedy
# decoding, and the raw response is used as the translation.
#
#   llama-server -m Hy-MT2-30B-A3B-Q4_K_M.gguf --cpu-moe -ngl 99 \
#     --host 0.0.0.0 --port 8081
#
# [hy-mt2]
# type = "openai-compatible"
# base_url = "http://localhost:8081/v1"
# model = "hy-mt2"
# mode = "plain"
# api_key_env = ""
# # Reloading a 30B model from disk on the first request takes tens of seconds,
# # so allow well over the 60 s default.
# timeout = 300
# # The instruction from the model card; {target_language} is substituted.
# instruction = "将以下文本翻译成{target_language},注意只需要输出翻译后的结果,不要额外解释:"
# stop = ["<eos:6124c78e>", "<｜hy_User｜>", "<｜hy_Assistant｜>"]
